spring.application.name=ai-billing-intelligence

spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080

# Hybrid AI: set api-key below locally (do not commit real keys)
billing.ai.mode=auto
billing.ai.gemini.api-key=${GEMINI_API_KEY:}
billing.ai.gemini.model=gemini-3.1-flash-lite
billing.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Demo seeder (H2 default; also used when oracle profile has empty tables)
billing.seed.enabled=true
billing.seed.policy-count=100

logging.level.com.capstone.billing=INFO
logging.level.com.capstone.billing.ai=INFO
