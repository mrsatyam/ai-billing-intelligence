<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Policies at Risk · AI Billing Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="app-body">
<nav class="navbar navbar-expand-lg navbar-dark bg-navy px-3">
    <a class="navbar-brand fw-semibold" th:href="@{/}">AI Billing Intelligence</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
        <a class="nav-link" th:href="@{/}">Dashboard</a>
        <a class="nav-link active" th:href="@{/policies/at-risk}">Policies at Risk</a>
        <a class="nav-link" th:href="@{/simulator}">Simulator</a>
    </div>
</nav>

<main class="container-fluid px-3 px-lg-4 py-4">
    <div class="mb-4">
        <p class="text-teal text-uppercase small mb-1">Priority queue</p>
        <h1 class="h3 text-white mb-1">Policies at Risk</h1>
        <p class="text-muted-light mb-0" th:text="${#lists.size(rows)} + ' policies with risk ≥ 70%'">0 policies</p>
    </div>

    <div class="panel">
        <div class="table-responsive">
            <table class="table table-darkish align-middle mb-0">
                <thead>
                <tr>
                    <th>Policy</th>
                    <th>Customer</th>
                    <th>Risk</th>
                    <th>AI Recommendation</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td class="fw-semibold" th:text="${row.policyNumber}">P1234</td>
                    <td th:text="${row.customerName}">John</td>
                    <td>
                        <span class="risk-pill" th:text="${row.riskScore} + '%'">91%</span>
                    </td>
                    <td th:text="${row.recommendation}">Offer Installments</td>
                    <td>
                        <a class="btn btn-sm btn-teal" th:href="@{/policies/{id}(id=${row.policyId})}">Analyze</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="5" class="text-muted-light">No at-risk policies found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/chat-widget :: chatWidget}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
