<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AI Decision Approved</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="app-body">
<nav class="navbar navbar-dark bg-navy px-3">
    <a class="navbar-brand fw-semibold" th:href="@{/}">AI Billing Intelligence</a>
</nav>
<main class="container py-5">
    <div class="hero-panel p-5 text-center">
        <p class="text-teal text-uppercase small mb-2">Workflow updated</p>
        <h1 class="display-6 text-white mb-3">AI Decision Created</h1>
        <p class="lead text-muted-light mb-4"
           th:text="'Approved ' + ${decision.recommendation.label} + ' for ' + ${customer.name} + ' (' + ${policy.policyNumber} + ')'">
            Approved
        </p>
        <p class="text-muted-light"
           th:text="'Predicted success ' + ${decision.predictedSuccess} + '% · Status ' + ${decision.status}">
            Status
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a class="btn btn-teal" th:href="@{/policies/{id}(id=${policy.id})}">Back to analysis</a>
            <a class="btn btn-outline-teal" th:href="@{/policies/at-risk}">Policies at Risk</a>
            <a class="btn btn-outline-teal" th:href="@{/}">Dashboard</a>
        </div>
    </div>
</main>
</body>
</html>
