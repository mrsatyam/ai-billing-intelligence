# Activate with: --spring.profiles.active=oracle
# Requires Oracle reachable and credentials via env vars.
#
# Preferred app path: Hibernate creates/updates schema, DemoDataSeeder inserts 100 rows.
# Pure SQL path (SQL*Plus / SQL Developer):
#   @src/main/resources/db/oracle/schema.sql
#   @src/main/resources/db/oracle/seed-data.sql
# Then set billing.seed.enabled=false so the Java seeder does not duplicate rows.

spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USER:billing}
spring.datasource.password=${ORACLE_PASSWORD:billing}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

billing.seed.enabled=true
billing.seed.policy-count=100

spring.sql.init.mode=never
spring.h2.console.enabled=false
